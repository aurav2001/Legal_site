<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Architectural Fluted Column Emblem -->
    <g fill="#c5a059">
        <!-- Capital / Top cornice -->
        <rect x="4" y="6" width="32" height="3.5" rx="0.8"/>
        <rect x="7" y="11" width="26" height="2.8" rx="0.6"/>
        <!-- Fluted Shafts -->
        <rect x="8" y="15.5" width="3.5" height="29" rx="0.8"/>
        <rect x="14.5" y="15.5" width="3.5" height="29" rx="0.8"/>
        <rect x="21" y="15.5" width="3.5" height="29" rx="0.8"/>
        <rect x="27.5" y="15.5" width="3.5" height="29" rx="0.8"/>
        <!-- Plinth / Base -->
        <rect x="7" y="46" width="26" height="2.8" rx="0.6"/>
        <rect x="4" y="50.3" width="32" height="3.5" rx="0.8"/>
    </g>

    <!-- Typography -->
    <!-- MALHOTRA & CO. -->
    <text x="48" y="32" font-family="'Cinzel', 'Cardo', 'Playfair Display', 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="1.5" fill="#ffffff">
        MALHOTRA <tspan fill="#c5a059">&amp; CO.</tspan>
    </text>
    
    <!-- ADVOCATES & SOLICITORS -->
    <text x="49" y="47" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.8" fill="#c5a059">
        ADVOCATES &amp; SOLICITORS
    </text>
</svg>
